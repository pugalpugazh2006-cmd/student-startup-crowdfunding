<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Campaign - SeedPledge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-primary);"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                Seed<span>Pledge</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Explore</a>
                <a href="create-campaign.html" class="active">Start a Campaign</a>
                <a href="admin.html">Admin</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="glass-card animate-fade-in" style="max-width: 600px; margin: 2rem auto;">
            <h2>Launch Your Startup Pitch</h2>
            <form id="create-pitch-form">
                <div class="form-group">
                    <label for="founderName">Founder Name</label>
                    <input type="text" id="founderName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="title">Startup / Project Title</label>
                    <input type="text" id="title" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="problemStatement">Problem Statement</label>
                    <textarea id="problemStatement" class="form-control" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="solutionDescription">Solution Description</label>
                    <textarea id="solutionDescription" class="form-control" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label for="videoUrl">Pitch Video URL (Optional)</label>
                    <input type="url" id="videoUrl" class="form-control">
                </div>
                <div class="form-group">
                    <label for="targetAmount">Target Funding Amount (₹)</label>
                    <input type="number" id="targetAmount" class="form-control" required min="100">
                </div>
                <button type="submit" class="btn" style="width: 100%;">Create Campaign</button>
            </form>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
