<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SeedPledge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
        }
        th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-primary);"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                Seed<span>Pledge</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Explore</a>
                <a href="create-campaign.html">Start a Campaign</a>
                <a href="admin.html" class="active">Admin</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="glass-card animate-fade-in">
            <h2>Admin Dashboard</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Startup Title</th>
                            <th>Founder</th>
                            <th>Target</th>
                            <th>Raised</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body">
                        <!-- Injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadAdminDashboard();
        });
    </script>
</body>
</html>
